<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="eggGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#7c2d12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded squircle safe zone -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Egg Shape in Center Safe Zone -->
  <g filter="url(#shadow)">
    <path d="M256,90 C180,90 135,190 135,290 C135,370 190,422 256,422 C322,422 377,370 377,290 C377,190 332,90 256,90 Z" fill="url(#eggGrad)"/>
  </g>

  <!-- Egg Highlight Curve -->
  <path d="M220,130 C190,170 170,225 170,285 C170,300 172,315 175,325 C168,305 165,280 165,255 C165,200 185,150 215,125 Z" fill="#ffffff" opacity="0.6"/>

  <!-- Golden Arat Badge / Crown Accent -->
  <circle cx="256" cy="340" r="32" fill="#ea580c" opacity="0.9"/>
  <text x="256" y="348" font-family="'Hind Siliguri', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">আড়ৎ</text>
</svg>
